<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@latest/dist/web/static/pretendard.css">
<title>Big Brain</title>
<style>
:root {
  --bg: #faf9f6; --bg-sidebar: #f4f3ed; --bg-elevated: #ffffff;
  --border: #e8e5dc; --border-strong: #d4d0c4;
  --text: #1f1c18; --text-muted: #76705f; --text-subtle: #a8a293;
  --accent: #0ea5e9; --accent-hover: #0284c7; --accent-bg: rgba(14,165,233,0.10);
  --shadow: 0 1px 2px rgba(31,28,24,0.04), 0 4px 12px rgba(31,28,24,0.04);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  font-size: 15px; line-height: 1.6; color: var(--text);
  background: var(--bg); height: 100vh; overflow: hidden;
}
.app { display: flex; height: 100vh; }
.sidebar {
  width: 260px; flex-shrink: 0; background: var(--bg-sidebar);
  border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 12px;
}
.sidebar-brand {
  padding: 12px 8px 16px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em;
}
.sidebar-brand .dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); margin-right: 8px; vertical-align: middle;
}
.new-chat-btn {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 10px 12px; background: var(--bg-elevated); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text); font-family: inherit; font-size: 14px;
  cursor: pointer; transition: all 0.15s ease; margin-bottom: 16px;
}
.new-chat-btn:hover { border-color: var(--border-strong); box-shadow: var(--shadow); }
.sidebar-section { margin-top: 16px; }
.sidebar-label {
  padding: 6px 8px; font-family: system-ui, sans-serif; font-size: 11px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-subtle);
  display: flex; justify-content: space-between; align-items: center;
}
.sidebar-label button {
  background: none; border: none; color: var(--text-subtle); cursor: pointer;
  font-size: 14px; padding: 0 4px; line-height: 1;
}
.sidebar-label button:hover { color: var(--text); }
.sidebar-list { list-style: none; max-height: 220px; overflow-y: auto; }
.sidebar-item {
  padding: 7px 10px; border-radius: 8px; cursor: pointer; font-size: 14px;
  color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background 0.1s ease;
}
.sidebar-item:hover { background: rgba(31,28,24,0.05); }
.sidebar-item.active { background: var(--accent-bg); color: var(--accent); }
.sidebar-item .meta { display: block; font-size: 11px; color: var(--text-subtle); margin-top: 2px; }
.sidebar-footer {
  margin-top: auto; padding: 10px 8px; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted);
}
.avatar {
  width: 28px; height: 28px; border-radius: 50%; background: var(--accent);
  color: white; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; font-family: system-ui;
}
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.main-header {
  padding: 16px 32px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--text-muted); min-height: 56px;
}
.breadcrumb-link { color: var(--text-muted); cursor: pointer; }
.breadcrumb-link:hover { color: var(--text); }
.breadcrumb-sep { color: var(--text-subtle); }
.breadcrumb-current { color: var(--text); font-weight: 500; }
.view-project, .view-chat, .empty-state { display: none; }
.view-project.visible { display: block; flex: 1; overflow-y: auto; padding: 48px 64px; max-width: 920px; margin: 0 auto; width: 100%; }
.view-chat.visible { display: flex; flex: 1; flex-direction: column; overflow: hidden; }
.empty-state.visible { display: flex; flex: 1; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); text-align: center; padding: 64px 32px; }
.project-title { font-size: 32px; font-weight: 600; letter-spacing: -0.02em; margin-bottom: 8px; }
.project-desc { color: var(--text-muted); font-size: 16px; margin-bottom: 40px; }
.section-title {
  font-family: system-ui, sans-serif; font-size: 13px; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted);
  margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center;
}
.knowledge-zone { border: 1.5px dashed var(--border-strong); border-radius: 14px; padding: 24px; background: var(--bg-elevated); margin-bottom: 40px; }
.file-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; list-style: none; }
.file-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); font-size: 14px; }
.file-icon { width: 32px; height: 32px; border-radius: 8px; background: var(--accent-bg); color: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
.file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-meta { font-size: 12px; color: var(--text-subtle); font-family: system-ui; }
.file-remove { background: none; border: none; color: var(--text-subtle); cursor: pointer; padding: 4px 8px; border-radius: 6px; font-family: system-ui; }
.file-remove:hover { background: rgba(31,28,24,0.06); color: var(--text); }
.upload-cta { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 13px; color: var(--text); font-family: inherit; }
.upload-cta:hover { border-color: var(--accent); color: var(--accent); }
.chat-list { display: flex; flex-direction: column; gap: 4px; }
.chat-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 10px; cursor: pointer; transition: background 0.1s ease; }
.chat-row:hover { background: var(--bg-elevated); }
.chat-row .chat-title-text { font-size: 15px; font-weight: 500; }
.chat-row .chat-meta { font-size: 12px; color: var(--text-subtle); font-family: system-ui; }
.chat-stream { flex: 1; overflow-y: auto; padding: 32px 0; }
.chat-stream-inner { max-width: 760px; margin: 0 auto; padding: 0 32px; display: flex; flex-direction: column; gap: 32px; }
.msg { display: flex; flex-direction: column; gap: 8px; }
.msg-role { font-family: system-ui; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-subtle); font-weight: 600; }
.msg-content { font-size: 16px; line-height: 1.7; color: var(--text); }
.msg.user { align-items: flex-end; }
.msg.user .msg-content { background: var(--bg-elevated); padding: 14px 18px; border-radius: 14px; max-width: 75%; border: 1px solid var(--border); }
.msg.assistant .msg-content h1 { font-size: 22px; font-weight: 700; margin: 22px 0 12px; line-height: 1.3; color: var(--text); }
.msg.assistant .msg-content h2 { font-size: 19px; font-weight: 700; margin: 20px 0 10px; line-height: 1.3; color: var(--text); }
.msg.assistant .msg-content h3 { font-size: 16px; font-weight: 700; margin: 16px 0 8px; line-height: 1.3; color: var(--text); }
.msg.assistant .msg-content h4 { font-size: 14px; font-weight: 700; margin: 12px 0 6px; line-height: 1.3; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
.msg.assistant .msg-content p { margin: 8px 0; }
.msg.assistant .msg-content strong { font-weight: 700; color: var(--text); }
.msg.assistant .msg-content em { font-style: italic; }
.msg.assistant .msg-content ul, .msg.assistant .msg-content ol { margin: 10px 0; padding-left: 26px; }
.msg.assistant .msg-content li { margin: 4px 0; line-height: 1.65; }
.msg.assistant .msg-content li > p { margin: 2px 0; }
.msg.assistant .msg-content code { background: var(--accent-bg); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }
.msg.assistant .msg-content pre { background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; margin: 12px 0; overflow-x: auto; }
.msg.assistant .msg-content pre code { background: none; color: var(--text); padding: 0; font-size: 13px; line-height: 1.55; }
.msg.assistant .msg-content blockquote { border-left: 3px solid var(--accent); padding: 6px 14px; margin: 12px 0; color: var(--text-muted); background: var(--accent-bg); border-radius: 0 6px 6px 0; }
.msg.assistant .msg-content table { border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 14px; }
.msg.assistant .msg-content th, .msg.assistant .msg-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
.msg.assistant .msg-content th { background: var(--bg-sidebar); font-weight: 700; }
.msg.assistant .msg-content tr:nth-child(even) td { background: rgba(0,0,0,0.015); }
.msg.assistant .msg-content hr { border: none; border-top: 1px solid var(--border); margin: 18px 0; }
.msg.assistant .msg-content a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
.msg.assistant .msg-content a:hover { color: var(--accent-hover); }
.msg.assistant .msg-content > *:first-child { margin-top: 0; }
.msg.assistant .msg-content > *:last-child { margin-bottom: 0; }
.msg-sources { margin-top: 12px; font-size: 13px; color: var(--text-muted); border-left: 2px solid var(--accent); padding: 8px 12px; background: var(--accent-bg); border-radius: 0 8px 8px 0; font-family: system-ui; }
.input-area { padding: 16px 32px 24px; border-top: 1px solid var(--border); background: var(--bg); }
.input-shell { max-width: 760px; margin: 0 auto; background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); transition: border-color 0.15s ease; }
.input-shell:focus-within { border-color: var(--border-strong); }
.input-attached { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.input-attached:empty { display: none; }
.file-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--accent-bg); color: var(--accent); border-radius: 16px; font-size: 12px; font-family: system-ui; }
.file-chip button { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; line-height: 1; font-size: 14px; }
textarea.input { width: 100%; border: none; outline: none; resize: none; font-family: inherit; font-size: 15px; line-height: 1.5; background: transparent; color: var(--text); min-height: 24px; max-height: 200px; }
.input-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
.input-actions { display: flex; gap: 6px; }
.icon-btn { width: 32px; height: 32px; border-radius: 8px; border: none; background: transparent; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-size: 16px; }
.icon-btn:hover { background: rgba(31,28,24,0.05); color: var(--text); }
.send-btn { width: 36px; height: 36px; border-radius: 10px; border: none; background: var(--accent); color: white; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; transition: background 0.15s ease; }
.send-btn:hover { background: var(--accent-hover); }
.send-btn:disabled { background: var(--border-strong); cursor: not-allowed; }
.hidden { display: none !important; }
.empty-state h2 { font-size: 28px; margin-bottom: 8px; color: var(--text); }
.empty-state p { font-size: 15px; }

.thinking-indicator { display: flex; align-items: center; gap: 14px; padding: 14px 18px; margin-top: 8px; }
.brain-loader { width: 56px; height: 46px; flex-shrink: 0; }
.brain-loader .stroke { fill: none; stroke: var(--text); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.brain-loader .chip { fill: var(--bg); stroke: var(--text); stroke-width: 5; stroke-linejoin: round; }
.brain-loader .node { fill: var(--bg); stroke: var(--text); stroke-width: 5; animation: nodeFlash 1.2s linear infinite; }
.brain-loader .n1 { animation-delay: 0s; }
.brain-loader .n2 { animation-delay: 0.15s; }
.brain-loader .n3 { animation-delay: 0.3s; }
.brain-loader .n4 { animation-delay: 0.45s; }
@keyframes nodeFlash {
  0%, 70%, 100% { fill: var(--bg); filter: none; }
  15%, 35% { fill: var(--accent); filter: drop-shadow(0 0 3px rgba(14,165,233,0.85)) drop-shadow(0 0 6px rgba(14,165,233,0.5)); }
}
.thinking-text { color: var(--text-muted); font-size: 14px; font-style: italic; }
.thinking-text .dots::after { content: ''; animation: dotsAnim 1.4s steps(4) infinite; }
@keyframes dotsAnim { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75%, 100% { content: '...'; } }

/* Second Brain — chat tail timeline (ledger v0.6 paradigm visible signature) */
.brain-events-timeline {
  margin-top: 32px; padding: 16px 0 8px; border-top: 1px solid var(--border);
}
.brain-events-header {
  display: flex; align-items: center; gap: 12px;
  font-family: var(--font-sans, system-ui, sans-serif);
  font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
  color: var(--text-subtle); margin-bottom: 12px;
}
.brain-events-header > span:first-child { font-size: 13px; color: var(--text-muted); text-transform: none; letter-spacing: 0; font-weight: 500; }
.brain-event {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 10px 12px; margin-bottom: 8px;
  background: var(--accent-bg, #eff6ff); border-radius: 8px;
  border-left: 3px solid var(--accent); font-size: 14px; line-height: 1.5;
}
.brain-event-icon { font-size: 16px; flex-shrink: 0; }
.brain-event-text { flex: 1; }
.brain-event-time { color: var(--text-subtle); font-size: 12px; margin-top: 2px; }
.brain-event.unread { box-shadow: 0 0 0 1px var(--accent); }
.brain-trigger-btn {
  padding: 4px 10px; font-size: 11px; background: transparent;
  border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
  color: var(--text-muted); font-family: inherit;
}
.brain-trigger-btn:hover { border-color: var(--accent); color: var(--accent); }
.brain-trigger-btn:disabled { opacity: 0.5; cursor: wait; }
.brain-trigger-status { font-size: 11px; color: var(--text-muted); margin-left: auto; }
.brain-events-empty { color: var(--text-subtle); font-size: 12px; padding: 8px 0; }
.brain-detail-panel { margin-top: 12px; padding: 12px; background: var(--surface-2, #faf6f2); border-radius: 8px; border: 1px solid var(--border); }
.brain-detail-section { margin-bottom: 12px; }
.brain-detail-section:last-child { margin-bottom: 0; }
.brain-detail-label { font-family: var(--font-sans, system-ui); font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); margin-bottom: 6px; display: block; }
.brain-detail-list { margin: 0; padding-left: 0; list-style: none; }
.brain-detail-list li { font-size: 13px; line-height: 1.5; padding: 4px 0; color: var(--text); }
.brain-detail-list li::before { content: "•"; color: var(--accent); margin-right: 8px; }
.brain-vocab-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.brain-vocab-tag { font-size: 11px; padding: 2px 8px; background: var(--accent-bg, #eff6ff); color: var(--accent); border-radius: 4px; border: 1px solid var(--accent); }
.brain-confidence { color: var(--text-subtle); font-size: 11px; margin-left: 6px; }
/* Sidebar Second Brain section */
.sidebar-section.brain-summary { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
.sidebar-section.brain-summary .sidebar-label { color: var(--accent); }
.brain-summary-stats { font-size: 12px; color: var(--text-muted); padding: 8px 12px; line-height: 1.7; }
.brain-summary-stat { display: flex; justify-content: space-between; }
.brain-summary-stat strong { color: var(--text); font-weight: 600; }

/* === Stage 3 v0.15 — Brain Timeline (paradigm visible signature first UI delivery) === */
.brain-timeline { margin: 48px 0 24px; padding: 24px 0; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 12px; }
.brain-timeline-header { font-size: 13px; color: var(--text-subtle); display: flex; align-items: center; gap: 8px; margin-bottom: 4px; letter-spacing: 0.02em; }
.brain-timeline-header .icon { font-size: 16px; }
.brain-event { padding: 14px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-soft, #f5f9ff); display: flex; flex-direction: column; gap: 6px; transition: border-color 0.15s ease; }
.brain-event:hover { border-color: #7cb8e8; }
.brain-event-summary { font-size: 14px; line-height: 1.55; color: var(--text); }
.brain-event-meta { font-size: 11px; color: var(--text-subtle); display: flex; gap: 12px; align-items: center; }
.brain-event-meta .type-badge { padding: 2px 8px; border-radius: 4px; background: rgba(124, 184, 232, 0.15); color: #2c6db3; font-weight: 500; letter-spacing: 0.02em; }
.brain-event-meta .angle-badge { padding: 2px 8px; border-radius: 4px; background: rgba(124, 184, 232, 0.08); color: var(--text-subtle); }
.brain-event.evt-extraction { background: #fafbfc; }
.brain-event.evt-discovery { background: #f5f9ff; }
.brain-timeline-empty { font-size: 13px; color: var(--text-subtle); font-style: italic; padding: 12px 0; }


/* === Stage 3.1 v0.16 — Brain Event card expand === */
.brain-event { cursor: pointer; }
.brain-event-detail { display: none; padding-top: 12px; margin-top: 8px; border-top: 1px dashed var(--border); font-size: 13px; line-height: 1.65; color: var(--text); }
.brain-event.expanded .brain-event-detail { display: block; }
.brain-event-detail .label { font-size: 11px; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; margin-top: 12px; }
.brain-event-detail .label:first-child { margin-top: 0; }
.brain-event-detail .reasoning { background: rgba(124, 184, 232, 0.08); padding: 10px 12px; border-radius: 6px; border-left: 3px solid #7cb8e8; font-style: italic; }
.brain-event-detail .abstract { color: var(--text); max-height: 200px; overflow-y: auto; padding-right: 8px; }
.brain-event-detail .doi-link { display: inline-block; margin-top: 6px; font-size: 12px; color: #2c6db3; text-decoration: none; padding: 4px 10px; border: 1px solid #7cb8e8; border-radius: 4px; }
.brain-event-detail .doi-link:hover { background: rgba(124, 184, 232, 0.1); }
.brain-event-meta-detail { display: flex; gap: 16px; font-size: 11px; color: var(--text-subtle); margin-top: 6px; }
.brain-event-toggle-hint { font-size: 11px; color: var(--text-subtle); margin-left: auto; }


/* === Stage 3.2 v0.16 — sidebar footer always visible (overflow fix) === */
.sidebar { overflow: hidden; }
.sidebar-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; }
/* 3 brain-summary sidebar-list 짧게 — sidebar 의 부담 줄이기 */
.sidebar-section.brain-summary .sidebar-list { max-height: 160px; }

</style>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js"></script>

    <div class="sidebar-footer" id="sidebar-footer">

      <div class="chat-stream"><div class="chat-stream-inner" id="message-stream"></div>
<div id="brain-events" class="brain-events-timeline" style="display:none;">
  <div class="brain-events-header">
    <span>🌳 Big Brain</span>
  </div>
  <div id="brain-events-list"></div>
</div></div>
      <div class="input-area">
        <div class="input-shell">
          <div class="input-attached" id="chat-attached"></div>
          <textarea class="input" id="chat-input" rows="1" placeholder="Reply to Big Brain..."></textarea>
          <div class="input-row">
            <div class="input-actions"><button class="icon-btn" id="chat-attach-btn" title="Attach file">📎</button><button class="icon-btn" id="mode-toggle-btn" title="Strict: 올린 문서 안에서만 답합니다. 누르면 Explore(자유 추론)로 전환." style="width:auto;padding:0 10px;gap:5px;display:inline-flex;align-items:center;font-size:13px;">🛡 <span id="mode-toggle-label">Strict</span></button></div>
            <button class="send-btn" id="send-btn">→</button>
          </div>
          <input type="file" id="chat-file-input" class="hidden" multiple>
        </div>
      </div>
    </section>
    <section class="empty-state visible" id="empty-state">
      <h2 id="welcome-heading">Welcome back.</h2>
      <p>Pick a project or start a new chat.</p>
    </section>
  </main>
</div>
<script>

// === D4.5e-6: OAuth session 검증 (2026-05-03) ===
let currentUser = null;
async function checkAuth() {
  try {
    const r = await fetch('/auth/me');
    const data = await r.json();
    if (!data.authenticated) {
      window.location.href = '/auth/login';
      return false;
    }
    currentUser = data;
    // footer 업데이트
    const av = document.getElementById('user-avatar');
    const nm = document.getElementById('user-name');
    const wh = document.getElementById('welcome-heading');
    if (av) {
      if (data.picture_url) {
        av.innerHTML = '<img src="' + data.picture_url + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
      } else {
        av.textContent = (data.display_name || data.email || '?').charAt(0).toUpperCase();
      }
    }
    if (nm) nm.textContent = data.display_name || data.email;
    if (wh) {
      const firstName = (data.display_name || '').split(' ')[0] || data.email.split('@')[0];
      wh.textContent = 'Welcome back, ' + firstName + '.';
    }
    return true;
  } catch (e) {
    console.error('auth check failed', e);
    window.location.href = '/auth/login';
    return false;
  }
}
// === end D4.5e-6 ===
const state = { view: 'empty', projects: [], currentProjectId: null, currentChatId: null, chatAttached: [], mode: 'strict' };

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function fmtBytes(n) { if (!n) return ''; if (n < 1024) return n+' B'; if (n < 1048576) return Math.round(n/1024)+' KB'; return (n/1048576).toFixed(1)+' MB'; }
function fmtTime(s) { if (!s) return ''; return s.replace(/^2026-/, '').replace(/:\d\d$/, ''); }

async function api(method, path, body) {
  const opts = { method, headers: {'Content-Type':'application/json'} };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch('/api' + path, opts);
  if (!r.ok) { const t = await r.text(); throw new Error(`${method} ${path} → ${r.status} ${t}`); }
  return r.json();
}

async function uploadFile(path, file) {
  const fd = new FormData(); fd.append('file', file);
  const r = await fetch('/api' + path, { method:'POST', body: fd });
  if (!r.ok) { const t = await r.text(); throw new Error(`upload ${path} → ${r.status} ${t}`); }
  return r.json();
}

async function fetchProjects() {
  const { projects } = await api('GET', '/projects');
  const detailed = await Promise.all(projects.map(p => api('GET', `/projects/${p.id}`)));
  state.projects = detailed.map(p => ({...p, chats: p.chats || [], files: p.files || []}));
}

async function fetchMessages(chatId) {
  const { messages } = await api('GET', `/chats/${chatId}/messages`);
  return messages;
}

async function fetchChatFiles(chatId) {
  const { files } = await api('GET', `/chats/${chatId}/files`);
  return files;
}

function renderSidebar() {
  document.getElementById('project-list').innerHTML = state.projects.map(p => `<li class="sidebar-item ${state.currentProjectId===p.id&&state.view==='project'?'active':''}" onclick="openProject(${p.id})">${escapeHtml(p.name)}<span class="meta">${(p.chats||[]).length} chats · ${(p.files||[]).length} files</span></li>`).join('') || '<li style="color:var(--text-subtle);font-size:12px;padding:8px;">No projects yet</li>';
  const all = [];
  state.projects.forEach(p => (p.chats||[]).forEach(c => all.push({...c, projectId: p.id, projectName: p.name})));
  all.sort((a,b) => (b.updated_at||'').localeCompare(a.updated_at||''));
  document.getElementById('recent-chat-list').innerHTML = all.slice(0,10).map(c => `<li class="sidebar-item ${state.currentChatId===c.id?'active':''}" onclick="openChat(${c.projectId},${c.id})">${escapeHtml(c.title)}<span class="meta">${escapeHtml(c.projectName)} · ${fmtTime(c.updated_at)}</span></li>`).join('') || '<li style="color:var(--text-subtle);font-size:12px;padding:8px;">No recents</li>';
}

function renderProject() {
  const p = state.projects.find(x => x.id === state.currentProjectId); if (!p) return;
  document.getElementById('project-title').textContent = p.name;
  document.getElementById('project-desc').textContent = p.description || '';
  document.getElementById('breadcrumb').innerHTML = `<span class="breadcrumb-current">${escapeHtml(p.name)}</span>`;
  document.getElementById('file-list').innerHTML = (p.files||[]).map(f => `<li class="file-item"><div class="file-icon">📄</div><div class="file-name">${escapeHtml(f.filename)}</div><div class="file-meta">${fmtBytes(f.size_bytes)}</div><button class="file-remove" onclick="deleteProjectFile(${f.id});event.stopPropagation();">✕</button></li>`).join('') || '<li style="color:var(--text-subtle);font-size:13px;padding:8px;list-style:none;">No files yet. Click Add files below.</li>';
  document.getElementById('project-chat-list').innerHTML = (p.chats||[]).length ? p.chats.map(c => `<div class="chat-row" onclick="openChat(${p.id},${c.id})"><div class="chat-title-text">${escapeHtml(c.title)}</div><div class="chat-meta">${fmtTime(c.updated_at)}</div></div>`).join('') : '<div style="color:var(--text-subtle);font-size:13px;padding:16px;">No chats yet.</div>';
}

async function renderChat() {
  const p = state.projects.find(x => x.id === state.currentProjectId); if (!p) return;
  const c = (p.chats||[]).find(x => x.id === state.currentChatId); if (!c) return;
  document.getElementById('breadcrumb').innerHTML = `<span class="breadcrumb-link" onclick="openProject(${p.id})">${escapeHtml(p.name)}</span><span class="breadcrumb-sep">›</span><span class="breadcrumb-current">${escapeHtml(c.title)}</span>`;
  const msgs = await fetchMessages(c.id);
  c.messages = msgs;
  const stream = document.getElementById('message-stream');
  stream.innerHTML = msgs.length ? msgs.map(m => {
    let srcHtml = '';
    if (m.sources_json) { try { const s = JSON.parse(m.sources_json); if (Array.isArray(s) && s.length) srcHtml = `<div class="msg-sources">📎 ${s.length} sources</div>`; } catch {} }
    const rendered = m.role === 'assistant'
      ? DOMPurify.sanitize(marked.parse(m.content))
      : escapeHtml(m.content).replace(/\n/g, '<br>');
    return `<div class="msg ${m.role}"><div class="msg-role">${m.role==='user'?'You':'Brain'}</div><div class="msg-content">${rendered}</div>${srcHtml}</div>`;
  }).join('') : '<div style="text-align:center;color:var(--text-subtle);padding:64px 16px;">대화를 시작해보세요.</div>';
  // chat-scoped attachments restore
  state.chatAttached = await fetchChatFiles(c.id);
  renderChatChips();
  await renderBrainTimeline(state.currentChatId);
  renderBrainEvents();
  setTimeout(() => { const sc = stream.parentElement; sc.scrollTop = sc.scrollHeight; }, 50);
}

function renderChatChips() {
  document.getElementById('chat-attached').innerHTML = state.chatAttached.map(f => `<span class="file-chip">📎 ${escapeHtml(f.filename)} <button onclick="deleteChatFile(${f.id})">×</button></span>`).join('');
}

function setView(v) {
  state.view = v;
  document.getElementById('view-project').classList.toggle('visible', v === 'project');
  document.getElementById('view-chat').classList.toggle('visible', v === 'chat');
  document.getElementById('empty-state').classList.toggle('visible', v === 'empty');
  document.getElementById('breadcrumb').style.display = v === 'empty' ? 'none' : 'flex';
}

async function openProject(id) {
  state.currentProjectId = id; state.currentChatId = null; state.chatAttached = [];
  const detail = await api('GET', `/projects/${id}`);
  const idx = state.projects.findIndex(x => x.id === id);
  if (idx >= 0) state.projects[idx] = {...detail, chats: detail.chats||[], files: detail.files||[]};
  setView('project'); renderSidebar(); renderProject();
}

async function openChat(pid, cid) {
  state.currentProjectId = pid; state.currentChatId = cid; state.chatAttached = [];
  setView('chat'); renderSidebar(); await renderChat(); document.getElementById('chat-input').focus();
}

async function newProject() {
  const name = prompt('새 프로젝트 이름?'); if (!name) return;
  try { const p = await api('POST', '/projects', { name, description: '' }); await fetchProjects(); openProject(p.id); }
  catch (e) { alert('Failed: ' + e.message); }
}

async function newChat(pid) {
  if (!pid) return;
  try { const c = await api('POST', `/projects/${pid}/chats`, {}); await fetchProjects(); openChat(pid, c.id); }
  catch (e) { alert('Failed: ' + e.message); }
}

async function newChatGlobal() {
  // v0.17 A1: ChatGPT/Claude-style standalone = "Quick Chats" auto-project
  let qp = state.projects.find(p => p.name === 'Quick Chats');
  if (!qp) {
    await api('POST', '/projects', { name: 'Quick Chats' });
    await fetchProjects();
    qp = state.projects.find(p => p.name === 'Quick Chats');
  }
  if (!qp) { console.error('Quick Chats project create failed'); return; }
  await newChat(qp.id);
}

async function deleteProjectFile(fid) {
  if (!confirm('이 파일을 삭제하시겠어요?')) return;
  try { await api('DELETE', `/files/${fid}`); await openProject(state.currentProjectId); }
  catch (e) { alert('Delete failed: ' + e.message); }
}

async function deleteChatFile(fid) {
  try { await api('DELETE', `/files/${fid}`); state.chatAttached = state.chatAttached.filter(f => f.id !== fid); renderChatChips(); }
  catch (e) { alert('Delete failed: ' + e.message); }
}


// === Stage 3 v0.15 — Brain Timeline (paradigm visible signature first UI delivery) ===
async function renderBrainTimeline(chatId) {
  if (!chatId) return;
  const stream = document.getElementById('message-stream');
  if (!stream) return;
  const old = stream.querySelector('.brain-timeline');
  if (old) old.remove();

  let data;
  try {
    const resp = await fetch(`/api/chats/${chatId}/brain-events`, { credentials: 'include' });
    if (!resp.ok) return;
    data = await resp.json();
  } catch (e) { console.warn('brain-events fetch fail', e); return; }

  const events = (data && data.events) || [];
  if (!events.length) return;

  const container = document.createElement('div');
  container.className = 'brain-timeline';
  container.innerHTML = `<div class="brain-timeline-header"><span class="icon">🌊</span><span>Brain Timeline</span><span style="margin-left:auto;font-size:11px;">${events.length} event${events.length>1?'s':''}</span></div>`;

  for (const ev of events) {
    container.appendChild(renderBrainEventCard(ev));
  }
  stream.appendChild(container);
}

function renderBrainEventCard(ev) {
  const card = document.createElement('div');
  const isDisc = ev.event_type === 'discovery_generated';
  const isExt = ev.event_type === 'extraction_completed';
  card.className = 'brain-event ' + (isDisc ? 'evt-discovery' : (isExt ? 'evt-extraction' : ''));

  let typeBadge = '';
  let angleBadge = '';
  let evMeta = {};
  if (isDisc) {
    try {
      evMeta = typeof ev.evidence_chain_json === 'string' ? JSON.parse(ev.evidence_chain_json) : (ev.evidence_chain_json || {});
      if (ev.type) typeBadge = `<span class="type-badge">${ev.type}</span>`;
      if (evMeta && evMeta.angle_pattern) angleBadge = `<span class="angle-badge">${evMeta.angle_pattern}</span>`;
    } catch (e) {}
  }

  const summary = ev.summary_text || ev.event_type;
  const occurred = ev.occurred_at ? new Date(ev.occurred_at + (ev.occurred_at.includes('Z') ? '' : 'Z')).toLocaleString() : '';
  const safeEsc = (typeof escapeHtml === 'function') ? escapeHtml : (s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])));

  // Detail block (only for discovery events with paper data)
  let detailHtml = '';
  if (isDisc && ev.paper) {
    const paper = ev.paper;
    let absText = paper.abstract_text || '';
    // Strip our own [venue: ... | citations: ... | is_oa: ... | abstract_source: ...] prefix (drift #4 unstash)
    const prefixMatch = absText.match(/^\[venue:[^\]]*\]\s*\n\n/);
    if (prefixMatch) absText = absText.substring(prefixMatch[0].length);
    if (absText.length > 1500) absText = absText.substring(0, 1500) + '...';

    const reasoning = (evMeta && evMeta.layer3_reasoning) || '';
    const cit = (evMeta && evMeta.citations) || 0;
    const venue = (evMeta && evMeta.venue) || '';
    const ans_cos = (evMeta && evMeta.ans_cos);
    const q_cos = (evMeta && evMeta.q_cos);
    const doi = paper.doi || '';
    const doiUrl = doi.startsWith('http') ? doi : (doi ? 'https://doi.org/' + doi.replace(/^https?:\/\/(dx\.)?doi\.org\//, '') : '');

    detailHtml = `
      <div class="brain-event-detail">
        ${reasoning ? `<div class="label">왜 이게 새 발견</div><div class="reasoning">${safeEsc(reasoning)}</div>` : ''}
        ${absText ? `<div class="label">Abstract</div><div class="abstract">${safeEsc(absText)}</div>` : ''}
        <div class="brain-event-meta-detail">
          ${venue ? `<span>📰 ${safeEsc(venue)}</span>` : ''}
          ${paper.year ? `<span>📅 ${safeEsc(String(paper.year))}</span>` : ''}
          ${cit ? `<span>📊 ${safeEsc(String(cit))} citations</span>` : ''}
          ${(typeof ans_cos === 'number') ? `<span>🎯 ans_cos=${ans_cos.toFixed(3)}</span>` : ''}
          ${(typeof q_cos === 'number') ? `<span>q_cos=${q_cos.toFixed(3)}</span>` : ''}
        </div>
        ${doiUrl ? `<a href="${safeEsc(doiUrl)}" target="_blank" rel="noopener" class="doi-link" onclick="event.stopPropagation();">📄 Open paper →</a>` : ''}
      </div>
    `;
  }

  card.innerHTML = `
    <div class="brain-event-summary">${safeEsc(summary)}</div>
    <div class="brain-event-meta">
      ${typeBadge}
      ${angleBadge}
      ${occurred ? `<span class="brain-event-toggle-hint">${safeEsc(occurred)} · 클릭하여 펼치기</span>` : ''}
    </div>
    ${detailHtml}
  `;

  if (isDisc) {
    card.addEventListener('click', () => {
      card.classList.toggle('expanded');
    });
  }
  return card;
}

async function sendMessage() {
  const input = document.getElementById('chat-input'); const text = input.value.trim();
  if (!text && !state.chatAttached.length) return;
  if (!state.currentChatId) return;
  const sendBtn = document.getElementById('send-btn'); sendBtn.disabled = true;
  const note = state.chatAttached.length ? ` [+${state.chatAttached.length} files attached]` : '';
  input.value = ''; input.style.height = 'auto';
  // D4.5g: optimistic UI — show user msg + Brain thinking indicator immediately
  const stream = document.getElementById('message-stream');
  if (stream) {
    const userPreview = (text + note).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    stream.insertAdjacentHTML('beforeend',
      `<div class="msg user"><div class="msg-role">You</div><div class="msg-content">${userPreview.replace(/\n/g, '<br>')}</div></div>` +
      `<div class="msg assistant thinking-indicator" id="brain-thinking">` +
        `<svg class="brain-loader" viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg">` +
          `<path class="stroke" d="M95 28 C85 12, 62 18, 62 38 C50 34, 40 43, 39 57 C26 62, 22 76, 29 88 C19 100, 25 118, 40 122 C41 137, 55 146, 68 138 C73 156, 94 153, 95 135 Z"/>` +
          `<path class="stroke" d="M39 57 C47 59, 52 63, 55 70"/>` +
          `<path class="stroke" d="M29 88 C36 87, 42 88, 48 92"/>` +
          `<path class="stroke" d="M40 122 C48 121, 55 124, 60 130"/>` +
          `<path class="stroke" d="M68 138 C67 132, 69 127, 74 123"/>` +
          `<rect class="chip" x="88" y="72" width="48" height="40" rx="2"/>` +
          `<path class="stroke" d="M136 82 H158 V52 H178"/>` +
          `<path class="stroke" d="M136 92 H182"/>` +
          `<path class="stroke" d="M136 102 H182"/>` +
          `<path class="stroke" d="M136 112 H158 V142 H178"/>` +
          `<circle class="node n1" cx="186" cy="52" r="9"/>` +
          `<circle class="node n2" cx="192" cy="92" r="9"/>` +
          `<circle class="node n3" cx="192" cy="102" r="9"/>` +
          `<circle class="node n4" cx="186" cy="142" r="9"/>` +
        `</svg>` +
        `<div class="thinking-text">Big Brain이 답변 검색 중<span class="dots"></span></div>` +
      `</div>`);
    const sc = stream.parentElement;
    if (sc) setTimeout(() => { sc.scrollTop = sc.scrollHeight; }, 30);
  }
  try {
    // ledger v0.11: streaming branch — fetch SSE, append chunks live, reload on done.
    const resp = await fetch(`/api/chats/${state.currentChatId}/messages?stream=1&mode=${state.mode}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ content: text + note }),
    });
    if (!resp.ok || !resp.body) throw new Error('HTTP ' + resp.status);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let streamingMsg = null;   // <pre> for Brain chunks
    let generalMsg = null;     // <pre> for General full text
    let currentEvent = null;
    const sc = stream ? stream.parentElement : null;
    const autoScroll = () => { if (sc) sc.scrollTop = sc.scrollHeight; };

    let noBrainMode = false;  // ledger v0.11: hide Brain section + sources when no docs uploaded
    let brainBuffer = '';     // accumulate first chunks to detect "no info" markers before showing
    const handleEvent = (eventName, dataStr) => {
      let data;
      try { data = JSON.parse(dataStr); } catch { return; }
      if (eventName === 'start') {
        const hasSources = Array.isArray(data && data.retrieved) && data.retrieved.length > 0;
        noBrainMode = !hasSources;
        // thinking-indicator stays visible until first user-facing token
      } else if (eventName === 'brain_chunk') {
        if (noBrainMode) return;  // suppress Brain output when no docs
        if (!streamingMsg) {
          // ledger v0.11: hold brain section creation until we know the answer is meaningful.
          // If first chunks start with "I don't have information" or "해당 내용 없음" or 
          // "제공된 소스에는", switch to noBrainMode silently (Brain says "no info" → hide section,
          // let General mode answer instead). Indicator stays visible until General first token.
          brainBuffer = (brainBuffer || '') + (data.text || '');
          if (brainBuffer.length < 60) return;  // wait until we have enough to judge
          const sniff = brainBuffer.trim();
          const noInfoMarkers = ["I don't have information", "I do not have information",
                                  "해당 내용 없음", "제공된 소스에는", "관련 정보가 없",
                                  "정보가 포함되어 있지 않", "정보를 찾을 수 없"];
          if (noInfoMarkers.some(m => sniff.startsWith(m) || sniff.includes(m))) {
            noBrainMode = true;
            return;
          }
          // OK, real answer — create Brain section and flush buffer
          document.getElementById('brain-thinking')?.remove();
          if (stream) {
            stream.insertAdjacentHTML('beforeend',
              '<div class="msg assistant" id="streaming-msg"><div class="msg-role">Big Brain</div><div class="msg-content"><div style="font-size:12px;color:var(--text-subtle);margin-bottom:8px;">📄 본 문서 기반 (생성 중…)</div><pre id="streaming-pre" style="white-space:pre-wrap;word-wrap:break-word;font-family:inherit;font-size:16px;line-height:1.7;background:transparent;border:none;padding:0;margin:0;"></pre></div></div>');
            streamingMsg = document.getElementById('streaming-pre');
            streamingMsg.appendChild(document.createTextNode(brainBuffer));
            autoScroll();
          }
        } else if (data.text) {
          streamingMsg.appendChild(document.createTextNode(data.text));
          autoScroll();
        }
      } else if (eventName === 'general_chunk') {
        // v0.18 F2: General LLM chunk-by-chunk render.
        // 첫 chunk 도착 시 #general-msg + #general-pre 생성, 이후 chunk = appendChild incremental.
        // brain_chunk 동일 패턴. Cloudflare 5min timeout 회피 = first token <1s 학자 화면 visible.
        document.getElementById('brain-thinking')?.remove();
        let genPre = document.getElementById('general-pre');
        if (!genPre && stream) {
          const headerLabel = noBrainMode ? 'General Knowledge' : '🌐 일반 지식 답변';
          stream.insertAdjacentHTML('beforeend',
            '<div class="msg assistant" id="general-msg"><div class="msg-role">Big Brain</div><div class="msg-content"><div style="font-size:12px;color:var(--text-subtle);margin:0 0 8px;">' + headerLabel + '</div><pre id="general-pre" style="white-space:pre-wrap;word-wrap:break-word;font-family:inherit;font-size:16px;line-height:1.7;background:transparent;border:none;padding:0;margin:0;"></pre></div></div>');
          genPre = document.getElementById('general-pre');
        }
        if (genPre && data.text) {
          genPre.appendChild(document.createTextNode(data.text));
          autoScroll();
        }
      } else if (eventName === 'general') {
        // General final confirm — chunk 모두 도착 후 final text 검증/replacement.
        // v0.18 F2: 정상 path = #general-pre 이미 chunk 로 채워짐 (zero op).
        // fallback path = chunk event 누락 (드물게) → final text 로 한 번에 render.
        document.getElementById('brain-thinking')?.remove();
        let genPre = document.getElementById('general-pre');
        if (!genPre && data.text && stream) {
          const headerLabel = noBrainMode ? 'General Knowledge' : '🌐 일반 지식 답변';
          stream.insertAdjacentHTML('beforeend',
            '<div class="msg assistant" id="general-msg"><div class="msg-role">Big Brain</div><div class="msg-content"><div style="font-size:12px;color:var(--text-subtle);margin:0 0 8px;">' + headerLabel + '</div><pre id="general-pre" style="white-space:pre-wrap;word-wrap:break-word;font-family:inherit;font-size:16px;line-height:1.7;background:transparent;border:none;padding:0;margin:0;"></pre></div></div>');
          document.getElementById('general-pre').textContent = data.text;
          autoScroll();
        }
      } else if (eventName === 'done') {
        document.getElementById('brain-thinking')?.remove();
        document.getElementById('streaming-msg')?.remove();
        document.getElementById('general-msg')?.remove();
        fetchProjects().then(() => renderChat()).then(() => renderSidebar()).catch(()=>{});
      } else if (eventName === 'error') {
        document.getElementById('brain-thinking')?.remove();
        document.getElementById('streaming-msg')?.remove();
        document.getElementById('general-msg')?.remove();
        alert('Stream error: ' + (data.message || 'unknown'));
      }
    };

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      // SSE frame separator = blank line
      let idx;
      while ((idx = buf.indexOf('\n\n')) !== -1) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        let eventName = 'message';
        const dataLines = [];
        for (const line of frame.split('\n')) {
          if (line.startsWith('event: ')) eventName = line.slice(7).trim();
          else if (line.startsWith('data: ')) dataLines.push(line.slice(6));
        }
        if (dataLines.length) handleEvent(eventName, dataLines.join('\n'));
      }
    }
  } catch (e) {
    document.getElementById('brain-thinking')?.remove();
    // ledger v0.11: 답변이 이미 표시된 후 stream tail/reload 단계 error 는 silent
    // (학자 화면에는 답변 정상 visible — alert 짜증 줄임). 진짜 error 는 console 에서 진단.
    console.warn('[stream tail] ', e && e.message ? e.message : e);
    const hasAnswer = document.getElementById('streaming-msg') || document.getElementById('general-msg');
    if (!hasAnswer) {
      alert('Send failed: ' + (e && e.message ? e.message : 'unknown'));
    }
    document.getElementById('streaming-msg')?.remove();
    document.getElementById('general-msg')?.remove();
    // best-effort reload (silent)
    fetchProjects().then(() => renderChat()).then(() => renderSidebar()).catch(()=>{});
  }
  finally { sendBtn.disabled = false; input.focus(); }
}

document.addEventListener('DOMContentLoaded', async () => {
  if (!await checkAuth()) return;
  document.getElementById('new-chat-btn').addEventListener('click', newChatGlobal);
  document.getElementById('new-project-btn').addEventListener('click', newProject);
  document.getElementById('new-chat-in-project-btn').addEventListener('click', () => newChat(state.currentProjectId));
  // Project knowledge upload
  document.getElementById('project-upload-btn').addEventListener('click', () => document.getElementById('project-file-input').click());
  document.getElementById('project-file-input').addEventListener('change', async (e) => {
    const pid = state.currentProjectId; if (!pid) return;
    for (const f of Array.from(e.target.files)) {
      try { await uploadFile(`/projects/${pid}/files`, f); } catch (err) { alert(`Upload failed (${f.name}): ` + err.message); }
    }
    e.target.value = '';
    await openProject(pid);
  });
  // Chat-scoped attachment
  document.getElementById('chat-attach-btn').addEventListener('click', () => document.getElementById('chat-file-input').click());
  document.getElementById('chat-file-input').addEventListener('change', async (e) => {
    const cid = state.currentChatId; if (!cid) return;
    for (const f of Array.from(e.target.files)) {
      try { const row = await uploadFile(`/chats/${cid}/files`, f); state.chatAttached.push(row); }
      catch (err) { alert(`Attach failed (${f.name}): ` + err.message); }
    }
    e.target.value = '';
    renderChatChips();
  });
  const ta = document.getElementById('chat-input');
  ta.addEventListener('input', () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 200)+'px'; });
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      if (ta.value.trim().length < 1) return;
      sendMessage();
    }
  });
  document.getElementById('send-btn').addEventListener('click', sendMessage);
  (function(){
    var mt = document.getElementById('mode-toggle-btn');
    if (mt) mt.addEventListener('click', function(){
      state.mode = (state.mode === 'strict') ? 'explore' : 'strict';
      var lbl = document.getElementById('mode-toggle-label');
      if (state.mode === 'strict') { mt.firstChild.nodeValue = '\uD83D\uDEE1 '; if(lbl) lbl.textContent = 'Strict'; mt.title = 'Strict: 올린 문서 안에서만 답합니다. 누르면 Explore(자유 추론)로 전환.'; }
      else { mt.firstChild.nodeValue = '\uD83E\uDDED '; if(lbl) lbl.textContent = 'Explore'; mt.title = 'Explore: 문서 밖 일반 지식 추론을 포함합니다. 누르면 Strict로 전환.'; }
    });
  })();
  try { await fetchProjects(); renderSidebar(); } catch (e) { console.error('Init load failed:', e); }
});


// === Second Brain — sidebar recent events (ledger v0.9 paradigm visible signature) ===
async function loadRecentBrainEvents() {
  return;  // Second Brain FROZEN 2026-06-01 — re-enable: remove this line
  try {
    const res = await fetch('/api/brain-events/recent?limit=5', { credentials: 'include' });
    if (!res.ok) return;
    const data = await res.json();
    const events = data.events || [];
    const ul = document.getElementById('brain-events-recent');
    if (!ul) return;
    if (events.length === 0) {
      ul.innerHTML = '<li style="color:var(--text-subtle);font-size:12px;padding:8px;">아직 추출 항목 없음</li>';
      return;
    }
    ul.innerHTML = events.map(e => {
      const isActive = (typeof state !== 'undefined' && state.currentChatId === e.chat_id) ? 'active' : '';
      const title = escapeHtml(e.chat_title || '(no title)');
      const projectName = escapeHtml(e.project_name || '');
      const time = fmtTime(e.occurred_at);
      const summary = escapeHtml(e.summary_text || '');
      return '<li class="sidebar-item ' + isActive + '" onclick="openChat(' + e.project_id + ',' + e.chat_id + ')">' + title + '<span class="meta">' + projectName + ' · ' + time + '</span><span class="meta">' + summary + '</span></li>';
    }).join('');
  } catch (err) { console.error('loadRecentBrainEvents:', err); }
}
function _initBrainSidebar() {
  loadRecentBrainEvents();
  setInterval(loadRecentBrainEvents, 30000);
}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', _initBrainSidebar);
} else {
  _initBrainSidebar();
}

// === Second Brain — chat tail timeline (ledger v0.6 paradigm visible signature) ===
async function renderBrainEvents() {
  const host = document.getElementById('brain-events');
  if (!host) return;
  host.style.display = 'none'; return;  // Second Brain FROZEN 2026-06-01 — re-enable: remove this line
  if (!state.currentChatId) { host.style.display = 'none'; return; }
  host.style.display = 'block';
  const list = document.getElementById('brain-events-list');
  try {
    const data = await api('GET', `/chats/${state.currentChatId}/brain-events`);
    const events = data.events || [];
    const detail = data.extraction_detail;
    if (events.length === 0 && !detail) {
      list.innerHTML = '<div class="brain-events-empty">사용자님이 쉬거나 주무실때 Second Brain이 위의 내용을 더 조사하고, 발전시켜서 여기에 작성해 두겠습니다. 주무시고 나서 확인해 보세요.</div>';
      renderBrainSidebarSummary(null);
      return;
    }
    let html = events.map(e => `
      <div class="brain-event ${e.seen_at ? '' : 'unread'}">
        <div class="brain-event-icon">${escapeHtml(e.icon || '✨')}</div>
        <div class="brain-event-text">
          ${escapeHtml(e.summary_text)}
          <div class="brain-event-time">${fmtTime(e.occurred_at)}</div>
        </div>
      </div>`).join('');

    if (detail) {
      const sections = [];
      if (detail.mechanisms && detail.mechanisms.length) {
        sections.push(`<div class="brain-detail-section"><span class="brain-detail-label">⚙️ Mechanisms (${detail.mechanisms.length})</span><ul class="brain-detail-list">${detail.mechanisms.map(m => `<li>${escapeHtml(m.statement)}</li>`).join('')}</ul></div>`);
      }
      if (detail.open_questions && detail.open_questions.length) {
        sections.push(`<div class="brain-detail-section"><span class="brain-detail-label">❓ Open Questions (${detail.open_questions.length})</span><ul class="brain-detail-list">${detail.open_questions.map(q => `<li>${escapeHtml(q.text || q)}${q.confidence !== undefined ? `<span class="brain-confidence">conf ${q.confidence}</span>` : ''}</li>`).join('')}</ul></div>`);
      }
      if (detail.methods && detail.methods.length) {
        sections.push(`<div class="brain-detail-section"><span class="brain-detail-label">🔬 Methods (${detail.methods.length})</span><ul class="brain-detail-list">${detail.methods.map(m => `<li>${escapeHtml(m.name || m)}</li>`).join('')}</ul></div>`);
      }
      if (detail.frameworks && detail.frameworks.length) {
        sections.push(`<div class="brain-detail-section"><span class="brain-detail-label">📐 Frameworks (${detail.frameworks.length})</span><ul class="brain-detail-list">${detail.frameworks.map(f => `<li>${escapeHtml(f.name || f)}</li>`).join('')}</ul></div>`);
      }
      if (detail.vocabulary && detail.vocabulary.length) {
        sections.push(`<div class="brain-detail-section"><span class="brain-detail-label">📚 Vocabulary (${detail.vocabulary.length})</span><div class="brain-vocab-tags">${detail.vocabulary.map(v => `<span class="brain-vocab-tag">${escapeHtml(v.term || v)}</span>`).join('')}</div></div>`);
      }
      if (sections.length) {
        html += `<div class="brain-detail-panel">${sections.join('')}</div>`;
      }
    }

    list.innerHTML = html;
    renderBrainSidebarSummary(detail, events.length);
    api('POST', `/chats/${state.currentChatId}/brain-events/mark-seen`).catch(() => {});
  } catch (e) {
    console.error('brain events fetch failed:', e);
    list.innerHTML = '<div class="brain-events-empty">Brain events 불러오기 실패: ' + escapeHtml(e.message || String(e)) + '</div>';
  }
}

function renderBrainSidebarSummary(detail, eventCount) {
  const sec = document.getElementById('brain-summary-section');
  if (!sec) return;
  if (!detail && !eventCount) { sec.style.display = 'none'; return; }
  sec.style.display = 'block';
  document.getElementById('bs-extractions').textContent = detail ? '1' : '0';
  document.getElementById('bs-mechanisms').textContent = detail && detail.mechanisms ? detail.mechanisms.length : '0';
  document.getElementById('bs-events').textContent = eventCount || '0';
}

async function triggerG1Now() {
  if (!state.currentChatId) return;
  const btn = document.querySelector('.brain-trigger-btn');
  const status = document.getElementById('brain-trigger-status');
  if (btn) btn.disabled = true;
  if (status) status.textContent = '⏳ Brain 분석 중... (~20s)';
  try {
    const data = await api('POST', `/chats/${state.currentChatId}/extract-now`);
    if (data.status === 'completed') {
      const cost = data.cost_usd ? `$${data.cost_usd.toFixed(4)}` : '';
      if (status) status.textContent = `✅ ${data.mechanism_count}개 mechanism (${cost})`;
      await renderBrainEvents();
    } else if (data.status === 'skipped_already_done') {
      if (status) status.textContent = `⚪ 이미 추출됨`;
      await renderBrainEvents();
    } else if (data.status === 'skipped_too_short') {
      if (status) status.textContent = `⚪ message 부족 (최소 2개 필요)`;
    } else {
      if (status) status.textContent = `❌ ${data.status}: ${((data.error||'')+'').slice(0,80)}`;
    }
  } catch (e) {
    if (status) status.textContent = `❌ ${e.message || e}`;
  } finally {
    if (btn) btn.disabled = false;
    setTimeout(() => { if (status) status.textContent = ''; }, 8000);
  }
}
